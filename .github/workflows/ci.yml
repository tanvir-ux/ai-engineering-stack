name: CI
on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python (ruff, mypy, pytest incl. Spark, bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -e ".[dev,spark]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/aistack
      - run: pytest -q
      - run: bandit -q -r src -ll
      - run: pip-audit --skip-editable --progress-spinner off

  frontend:
    name: frontend (tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  platform-config:
    name: bundle, helm, kubeconform, terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: databricks/setup-cli@main
      - name: Databricks bundle validates offline (stub workspace, nothing is deployed)
        run: python scripts/validate_bundle.py
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: helm lint
        run: helm lint deploy/helm/aistack
      - name: Rendered manifest is up to date
        run: |
          helm template aistack deploy/helm/aistack > /tmp/rendered.yaml
          diff -u deploy/k8s/aistack.yaml /tmp/rendered.yaml
      - name: kubeconform (strict)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 deploy/k8s/aistack.yaml
      - uses: hashicorp/setup-terraform@v3
      - name: terraform validate (no backend, no credentials)
        run: |
          cd deploy/terraform
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate

  docker:
    name: docker images build and the compose stack serves
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: docker compose up -d --build
      - name: End-to-end smoke (PKCE login, RAG answer, human-approved MCP tool call)
        run: python scripts/compose_smoke.py --base http://localhost:8000 --web http://localhost:8080
      - if: failure()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v
