apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "aistack.labels" . | nindent 4 }}
data:
  AISTACK_LLM_MODE: {{ .Values.config.llmMode | quote }}
  AISTACK_VECTOR_STORE: {{ .Values.config.vectorStore | quote }}
  AISTACK_IDP_MODE: {{ .Values.config.idpMode | quote }}
  AISTACK_OIDC_ISSUER: {{ include "aistack.issuer" . | quote }}
  AISTACK_OIDC_JWKS_URL: "http://{{ .Release.Name }}-api:8000/idp/jwks.json"
  AISTACK_OIDC_AUDIENCE: {{ .Values.config.oidcAudience | quote }}
  AISTACK_MCP_URL: "http://{{ .Release.Name }}-mcp:8001/mcp/"
  AISTACK_CORS_ORIGINS: {{ printf "[%q]" .Values.publicWebUrl | quote }}
  AISTACK_OIDC_REDIRECT_PREFIXES: {{ printf "[%q]" .Values.publicWebUrl | quote }}
  AISTACK_RATE_LIMIT_PER_MINUTE: {{ .Values.config.rateLimitPerMinute | quote }}
