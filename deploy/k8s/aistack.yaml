---
# Source: aistack/templates/api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aistack-api
  labels:
    app.kubernetes.io/name: aistack
    app.kubernetes.io/instance: aistack
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aistack
      app.kubernetes.io/instance: aistack
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aistack
        app.kubernetes.io/instance: aistack
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: "ghcr.io/tanvir-ux/ai-engineering-stack-api:0.1.0"
          imagePullPolicy: IfNotPresent
          args: ["aistack", "serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: aistack-config }
            - secretRef: { name: aistack-secrets, optional: true }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }

---
# Source: aistack/templates/mcp.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aistack-mcp
  labels:
    app.kubernetes.io/name: aistack
    app.kubernetes.io/instance: aistack
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aistack
      app.kubernetes.io/instance: aistack
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aistack
        app.kubernetes.io/instance: aistack
        app.kubernetes.io/component: mcp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mcp
          image: "ghcr.io/tanvir-ux/ai-engineering-stack-api:0.1.0"
          imagePullPolicy: IfNotPresent
          args: ["aistack", "mcp", "--transport", "http", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - { name: mcp, containerPort: 8001 }
          envFrom:
            - configMapRef: { name: aistack-config }
            - secretRef: { name: aistack-secrets, optional: true }
          livenessProbe:
            tcpSocket: { port: mcp }
            periodSeconds: 15
          readinessProbe:
            tcpSocket: { port: mcp }
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }

