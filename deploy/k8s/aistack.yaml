# Source: aistack/templates/api.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aistack-api
  labels:
    app.kubernetes.io/name: aistack
    app.kubernetes.io/instance: aistack
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aistack-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# Source: aistack/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aistack
  labels:
    app.kubernetes.io/name: aistack
    app.kubernetes.io/instance: aistack
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  ingressClassName: nginx
  tls:
    - secretName: aistack-tls
      hosts:
        - copilot.example.com
        - api.copilot.example.com
  rules:
    - host: copilot.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: aistack-web, port: { number: 8080 } }
    - host: api.copilot.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: aistack-api, port: { number: 8000 } }
