  AISTACK_CORS_ORIGINS: "[\"https://copilot.example.com\"]"
  AISTACK_OIDC_REDIRECT_PREFIXES: "[\"https://copilot.example.com\"]"
  AISTACK_RATE_LIMIT_PER_MINUTE: "30"

