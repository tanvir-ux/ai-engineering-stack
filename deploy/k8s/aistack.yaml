---
# Source: aistack/templates/networkpolicy.yaml
# Only the gateway may reach the MCP server. Everything else in the namespace is denied by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aistack-mcp
  labels:
    app.kubernetes.io/name: aistack
    app.kubernetes.io/instance: aistack
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aistack
      app.kubernetes.io/instance: aistack
      app.kubernetes.io/component: mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aistack
              app.kubernetes.io/instance: aistack
              app.kubernetes.io/component: api
      ports:
        - { port: 8001, protocol: TCP }

---
